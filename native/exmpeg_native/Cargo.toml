[package]
name = "exmpeg_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "exmpeg_native"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38.0"
# Our rsmpeg fork binds against FFmpeg 9.x. The crate links against the system
# ffmpeg libraries via pkg-config; FFMPEG_PKG_CONFIG_PATH can override the
# discovery path when building against a non-default install.
# TODO(revert: an rsmpeg release on crates.io carries FFmpeg 9 support and larksuite/rsmpeg#255): go back to the crates.io version.
rsmpeg = { git = "https://github.com/rubas/rsmpeg", rev = "5055c6d5c1530a617473f416e2773ef65f32af3c", default-features = false, features = ["link_system_ffmpeg", "ffmpeg9"] }

[features]
default = []

[lints.rust]
# `deny` rather than `forbid`: a handful of FFI helpers (reading C strings
# off `AVFormatContext` / `AVCodecParameters`, walking `AVDictionary` raw
# pointers) need explicit `unsafe`. Each such function carries a localized
# `#[allow(unsafe_code)]` so the crate-wide policy keeps everything else
# safe by default.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
doc_overindented_list_items = "allow"
# rsmpeg wrappers expose values as i32/u32; casting between integer widths
# is unavoidable and not actionable noise.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
