name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0"
  RUST_TOOLCHAIN: "1.97.1"
  EXMPEG_BUILD: "1"

jobs:
  check:
    name: Elixir + Rust verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout only; CI does not write to the repo
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-check
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shared build env
        uses: ./.github/actions/setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          rust-components: "rustfmt, clippy"

      - name: Install zizmor
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/zizmorcore/zizmor/releases/download/v1.27.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin" zizmor
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full check (Elixir + Rust)
        run: task check

      - name: Run integration tests
        run: task test:integration
